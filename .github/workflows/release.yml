name: Release

# Version tags publish only after every signed package is ready. Dispatch can
# build a draft without advertising an incomplete update feed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to verify, build, or create
        required: true
        type: string
      publish:
        description: Publish after all builds and signature checks succeed
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      published: ${{ steps.existing.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and source
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          let tagged;
          try { tagged = execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim(); }
          catch { assert.equal(process.env.RELEASE_EVENT, 'workflow_dispatch'); }
          if (process.env.RELEASE_EVENT === 'push') assert.equal(head, tagged);
          // Dispatch runs the current workflow against the immutable tag's
          // source, so workflow fixes never require moving a published tag.
          const sha = tagged || head;
          const { version } = JSON.parse(execFileSync('git', ['show', `${sha}:package.json`], { encoding: 'utf8' }));
          assert.equal(tag, `v${version}`);
          execFileSync('git', ['merge-base', '--is-ancestor', sha, 'origin/main']);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nsha=${sha}\nprerelease=${version.includes('-')}\n`);
          NODE
      - name: Check out pinned application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Check source version declarations
        working-directory: release-source
        run: node scripts/check-version.mjs
      - name: Verify any already published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/check-published-release.mjs "$RELEASE_TAG" "$RELEASE_SHA" release-source

  signing-key:
    name: Validate signing credentials
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check key and password before compiling
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp scripts/fixtures/updater/payload.txt "$RUNNER_TEMP/updater-signing-probe"
          # A version below every release prevents this test payload from ever
          # qualifying as an application upgrade. The signature is not uploaded.
          pnpm tauri signer sign "$RUNNER_TEMP/updater-signing-probe" --app-version 0.0.0 \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" > /dev/null
      - name: Verify the signing key matches the app public key
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { verifyArtifact } from './scripts/release-assets.mjs';
          const probe = path.join(process.env.RUNNER_TEMP, 'updater-signing-probe');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
          verifyArtifact(fs.readFileSync(probe), fs.readFileSync(`${probe}.sig`, 'utf8'), config.plugins.updater.pubkey, '0.0.0');
          console.log('Signing credentials match the public key embedded in the app.');
          NODE

  build:
    needs: [prepare, signing-key]
    name: Build ${{ matrix.platform }} (${{ matrix.label }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian packages retain support for Ubuntu 22.04 and newer.
          - platform: ubuntu-22.04
            label: deb
            bundles: deb
          # AppImage carries system libraries; use the current LTS for modern
          # GLib/Mesa hosts.
          - platform: ubuntu-26.04
            label: appimage
            bundles: appimage
          - platform: windows-latest
            label: windows
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - run: pnpm check:updates
      # Compile with no signing secret and no repository write token.
      - name: Build app
        run: pnpm tauri build --no-bundle --ci
      - name: Bundle and sign updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle --bundles ${{ matrix.bundles }} --ci
      - name: Verify and collect signed packages
        run: node scripts/release-assets.mjs collect target/release/bundle release-assets ${{ matrix.bundles }}
      # Keep verified packages available for diagnosis if an installer test
      # fails. Publication still requires this entire build job to succeed.
      - name: Save verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*
      - name: Test Windows MSI and NSIS upgrades
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-upgrade.ps1

  publish:
    name: Publish complete signed release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check out workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete feed
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/release-assets.mjs manifest release-assets "$RELEASE_TAG" "$REPOSITORY"
      - name: Require passing application CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          conclusion=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --commit "$RELEASE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')
          test "$conclusion" = success
      - name: Recheck for publication during the builds
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node release-tools/scripts/check-published-release.mjs "$RELEASE_TAG" "$RELEASE_SHA" .
      - name: Create draft, upload assets, then publish
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft > release-is-draft.txt; then
            test "$(cat release-is-draft.txt)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --draft \
              --target "$RELEASE_SHA" --title "OKF Reviewer $RELEASE_TAG" --notes-file release-assets/release-notes.md
          fi
          mapfile -d '' assets < <(find release-assets -type f ! -name 'release-notes.md' -print0)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --notes-file release-assets/release-notes.md --prerelease="$PRERELEASE"
          if [ "$PUBLISH" = true ]; then
            gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false
          fi
