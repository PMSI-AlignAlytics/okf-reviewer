version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      storybook-vitest:
        patterns:
          - storybook
          - "@storybook/*"
          - vitest
          - "@vitest/*"
      vite-react:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - babel-plugin-react-compiler
      typescript:
        patterns:
          - typescript
          - typescript-7
          - typescript-eslint
    # These major upgrades need coordinated migrations: TypeScript's lint
    # consumers, Vite's React/Babel setup, matching Vitest browser packages,
    # and Mermaid's renderer/browser compatibility. Keep minor and patch
    # updates enabled. SemVer ignore rules do not suppress security updates.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/browser-playwright"
        update-types: ["version-update:semver-major"]
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - tauri
          - "tauri-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
