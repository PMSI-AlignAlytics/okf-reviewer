version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tauri:
        patterns: ["@tauri-apps/*"]
      storybook-vitest:
        patterns:
          - storybook
          - "@storybook/*"
          - vitest
          - "@vitest/*"
      vite-react:
        patterns:
          - vite
          - "@vitejs/plugin-react"
          - babel-plugin-react-compiler
      typescript:
        patterns:
          - typescript
          - typescript-7
          - typescript-eslint
      compatible-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    # Routine breaking upgrades need an explicit compatibility review. Keep
    # minor, patch, and security updates enabled; SemVer update-type ignores
    # do not suppress security fixes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      tauri:
        patterns:
          - tauri
          - "tauri-*"
      compatible-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    # Cargo treats incompatible pre-1.0 releases (including sha2 0.11) as major
    # updates. Keep the current APIs until a migration is explicitly reviewed.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsonschema
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
